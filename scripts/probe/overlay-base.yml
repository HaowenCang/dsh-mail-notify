# The Phase 8 end-to-end probe overlay — config patches only.
#
# Applied on top of the shipped `headless` profile by `scripts/probe-e2e.mjs`,
# which boots `dsh --profile headless --patch <this file> --patch <generated
# inserts> "<task>"` against a disposable probe home and a loopback SMTP
# server. The INSERT rows live in the generated second layer, not here:
#
# - The inserted plugins' `name` values are absolute paths into this checkout,
#   and the pinned `0.1.5-rc.2` loader evaluates `!!js` expressions for
#   `disabled` and for config values but NEVER for an entry `name` — a
#   `!!js`-named insert reaches `import()` as an unevaluated `{ __jsExpr }`
#   node and the boot dies with `name.startsWith is not a function`. Plain
#   string names are the supported form (the overlay parser anchors absolute
#   paths to file URLs), and generating the rows keeps machine paths out of
#   the repository regardless.
# - The plugin's settings are serializable data, so the generated layer carries
#   them as an object instead of routing a JSON document through the
#   environment; there is one copy, produced by the same call that prints it.
#
# This file keeps the id-targeted config patches: a scripted model provider
# (so the run needs no external credential and consumes no real quota), the
# effective approval policy, and the shipped file-backed credential store
# retargeted at the disposable probe home. The `!!js` values here are CONFIG
# values, which the loader's config read interpolates.
#
# No secret appears here. The SMTP password is referenced by name through
# `smtpPasswordCredential` and resolved per send, and the value the probe
# resolves is a synthetic string that never leaves the loopback interface.

- id: agent-default-model
  config:
    provider: probe
    model: probe-scripted

# The effective approval policy for this composition is `ask`.
#
# It has to be stated: `dsh-base` derives the policy from the permission mode,
# and this machine runs the `danger-full-access` preset, whose policy is
# `never` — a mode in which the approval service rejects deterministically
# before any answerer is consulted and no `approval/asked` record exists to
# notify about. Pinning it here is what makes the test independent of the
# operator's own permission preset (Phase 8.1 §4).
- id: approval
  config:
    policy: ask

# The shipped file-backed credential store is retargeted rather than replaced.
#
# An earlier revision of this probe published a credential double instead, which
# meant the run never exercised the real store — and could not, therefore, say
# anything about the reference grammar the store actually accepts. Pointing the
# shipped provider at the disposable probe home keeps the production resolution
# path (per-attempt `resolve`, layer precedence, `describe`) and puts the whole
# credential chain under the same real service the plugin talks to.
- id: credentials
  config:
    path: !!js process.env.PROBE_CREDENTIALS_FILE
    watch: true
