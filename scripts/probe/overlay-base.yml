# The Phase 8 end-to-end probe overlay.
#
# Applied on top of the shipped `headless` profile by `scripts/probe-e2e.mjs`,
# which boots `dsh --profile headless --patch <this file> "<task>"` against a
# disposable probe home and a loopback SMTP server.
#
# It adds the rows the product tree does not carry for this test: a scripted
# model provider (so the run needs no external credential and consumes no real
# quota), the model-facing `ask_user_question` tool, an approval-requesting
# tool, the human stand-in, the credential-contract checker, and
# `dsh-mail-notify` itself pointed at the loopback server.
#
# The plugin specifiers are absolute paths because a loader row resolves a bare
# specifier through the profile's module root, and the probe deliberately keeps
# the plugin under test outside that root.
#
# They are built from `PROBE_ROOT` — the probe exports the repository root into
# this process — rather than written out. A literal checkout path here would pin
# the probe to one machine's directory layout and leak it into the repository.
#
# The plugin's settings arrive as one JSON document through the environment
# rather than as a nested YAML mapping: a mapping written here would have to
# restate every key, and a silent typo in one of them would change what the run
# proves. The JSON is produced by the probe itself, so the settings that took
# effect are exactly the settings it printed.
#
# No secret appears here. The SMTP password is referenced by name through
# `smtpPasswordCredential` and resolved per send, and the value the probe
# resolves is a synthetic string that never leaves the loopback interface.

- id: agent-default-model
  config:
    provider: probe
    model: probe-scripted

# The effective approval policy for this composition is `ask`.
#
# It has to be stated: `dsh-base` derives the policy from the permission mode,
# and this machine runs the `danger-full-access` preset, whose policy is
# `never` — a mode in which the approval service rejects deterministically
# before any answerer is consulted and no `approval/asked` record exists to
# notify about. Pinning it here is what makes the test independent of the
# operator's own permission preset (Phase 8.1 §4).
- id: approval
  config:
    policy: ask

# The shipped file-backed credential store is retargeted rather than replaced.
#
# An earlier revision of this probe published a credential double instead, which
# meant the run never exercised the real store — and could not, therefore, say
# anything about the reference grammar the store actually accepts. Pointing the
# shipped provider at the disposable probe home keeps the production resolution
# path (per-attempt `resolve`, layer precedence, `describe`) and puts the whole
# credential chain under the same real service the plugin talks to.
- id: credentials
  config:
    path: !!js process.env.PROBE_CREDENTIALS_FILE
    watch: true

- insert:
    - id: probe-timeline
      name: !!js process.env.PROBE_ROOT + '/scripts/probe/timeline.mjs'

    - id: probe-credential-contract
      name: !!js process.env.PROBE_ROOT + '/scripts/probe/credential-contract.mjs'

    - id: probe-scripted-provider
      name: !!js process.env.PROBE_ROOT + '/scripts/probe/scripted-provider.mjs'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: probe-approval-tool
      name: !!js process.env.PROBE_ROOT + '/scripts/probe/approval-tool.mjs'

    - id: probe-auto-answer
      name: !!js process.env.PROBE_ROOT + '/scripts/probe/auto-answer.mjs'

    - id: dsh-mail-notify
      name: !!js process.env.PROBE_ROOT + '/lib/index.js'
      config: !!js 'JSON.parse(process.env.PROBE_MAIL_CONFIG)'
